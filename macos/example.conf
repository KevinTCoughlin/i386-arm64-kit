# shellcheck shell=bash disable=SC2034
# container-launchd config (sourced by bash). Copy to
# ~/.config/container-launchd/NAME.conf and run:
#   container-launchd NAME install
# Only NAME and IMAGE are required.

NAME=steam-example                       # container name; also the default label
IMAGE=localhost/steam-example:latest

# Published ports, as for `container run --publish`.
PORTS=(27015:27015/udp 27015:27015/tcp)

# `--volume` specs. Named volumes (no leading / . ~) are chowned to
# VOLUME_OWNER before each start; single-file binds work too.
MOUNTS=(
    "steam-example-data:/srv/game"
    "${HOME}/.config/steam-example/server.cfg:/srv/game/server.cfg:ro"
)
VOLUME_OWNER=1000:1000                   # uid:gid the image runs as; empty = skip

ENV=(TZ=UTC)                             # --env KEY=VALUE
ENV_FILE=""                              # optional --env-file path (must exist)

MEMORY=1G                                # VM size: --memory / --cpus
CPUS=2
STOP_TIMEOUT=30                          # seconds `container stop` waits

RUN_ARGS=(--cap-drop ALL)                # anything else for `container run`
CMD=()                                   # arguments after the image

# Optional: build the image locally when it's missing (install / build).
BUILD_CONTEXT="${HOME}/Development/i386-arm64-kit"
CONTAINERFILE=examples/Containerfile     # relative to BUILD_CONTEXT
PLATFORM=linux/arm64

# LABEL=local.container-launchd.steam-example   # launchd label
# LOG_DIR="${HOME}/Library/Logs/container-launchd"   # log: LOG_DIR/NAME.log
# LOG_MAX_MB=10    # at each start, a log over this many MiB is moved to
#                  # NAME.log.1 and started afresh; 0 = never
